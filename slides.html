<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>잡도리 — 발표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root { --ink:#17151f; --ink2:#5b5870; --ink3:#9a97ad; --bg:#0f0d16; --surface:#1c1927; --line:#2b2838; --coach:#ff4d2e; --soft:#ffe8e2; --ok:#1baf7a; --warn:#ffb020; --danger:#e34948; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; letter-spacing:-.01em; word-break:keep-all; overflow:hidden; }
  button { font-family:inherit; letter-spacing:inherit; cursor:pointer; border:0; }
  #deck { position:fixed; inset:0; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:5vh 6vw calc(5vh + 56px); overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; opacity:0; transform:translateX(60px) scale(.98); transition:opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1.1); pointer-events:none; }
  .slide.active { opacity:1; transform:none; pointer-events:auto; }
  .slide.past { transform:translateX(-60px) scale(.98); }
  .slide-inner { width:min(1100px, 100%); margin-block:auto; min-width:0; }
  h1 { font-size:clamp(44px, 8vw, 110px); font-weight:900; line-height:1; margin:0; letter-spacing:-.03em; }
  h2 { font-size:clamp(30px, 5vw, 64px); font-weight:900; line-height:1.12; margin:0 0 .4em; letter-spacing:-.02em; }
  h2 em { font-style:normal; color:var(--coach); }
  p.lead { font-size:clamp(17px, 2.2vw, 26px); color:#cfcbe0; margin:.2em 0 0; line-height:1.5; }
  .kicker { font-size:clamp(12px,1.3vw,15px); font-weight:800; letter-spacing:.18em; color:var(--coach); text-transform:uppercase; margin-bottom:.8em; }
  .frag { opacity:0; transform:translateY(18px); transition:opacity .4s, transform .4s cubic-bezier(.2,.9,.3,1.2); }
  .frag.on { opacity:1; transform:none; }
  .row { display:flex; gap:2vw; align-items:center; flex-wrap:wrap; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:24px; }
  .btn { display:inline-flex; align-items:center; gap:8px; border-radius:18px; padding:16px 26px; font-size:clamp(16px,1.8vw,22px); font-weight:800; color:#fff; background:var(--coach); transition:transform .12s; }
  .btn:active { transform:scale(.96); }
  .btn.ghost { background:rgba(255,255,255,.12); }
  .btn.white { background:#fff; color:var(--ink); }
  .chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; background:rgba(255,255,255,.1); }

  /* 하단 */
  #progress { position:fixed; left:0; bottom:0; height:5px; background:var(--coach); width:0; transition:width .4s; z-index:20; }
  #hud { position:fixed; right:18px; bottom:14px; display:flex; gap:8px; align-items:center; z-index:20; font-size:13px; color:#9a97ad; }
  #hud button { background:rgba(255,255,255,.1); color:#fff; border-radius:999px; padding:6px 12px; font-weight:700; font-size:13px; }

  /* 얼굴 */
  .face { display:inline-block; overflow:visible; filter:drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
  .face.live { animation:breathe 3.2s ease-in-out infinite; transform-origin:50% 60%; }
  .face.talking { animation:talk .3s ease-in-out infinite; }
  .mouth-talk { transform-origin:50px 71px; animation:mouthTalk .22s ease-in-out infinite alternate; }
  @keyframes mouthTalk { 0%{transform:scaleY(.25)} 100%{transform:scaleY(1)} }
  @keyframes breathe { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-4px) scale(1.03)} }
  @keyframes talk { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  .wiggle { display:inline-block; animation:wiggle .5s ease-in-out infinite; transform-origin:50% 20%; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .pulse { animation:pulse 1.6s ease-in-out infinite; }

  /* 무대 연출 */
  #stage { position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
  .fx-black { position:absolute; inset:0; background:#000; }
  .fx-flash { position:absolute; inset:0; animation:flashOut .6s ease-out forwards; }
  @keyframes flashOut { 0%{opacity:.85} 100%{opacity:0} }
  .fx-tint { position:absolute; inset:0; background:rgba(227,73,72,.35); }
  .stamp { position:absolute; left:50%; top:16%; transform:translateX(-50%) rotate(-12deg); border:8px solid var(--c); color:var(--c); background:rgba(255,255,255,.92); border-radius:22px; padding:10px 30px; font-size:clamp(44px,8vw,96px); font-weight:900; line-height:1; animation:stampIn .35s cubic-bezier(.2,.9,.3,1.3) both, fadeOut .3s ease-in 1.6s forwards; }
  @keyframes stampIn { 0%{transform:translateX(-50%) scale(4) rotate(-12deg);opacity:0} 55%{transform:translateX(-50%) scale(.95) rotate(-12deg);opacity:1} 70%{transform:translateX(-50%) scale(1.05) rotate(-12deg)} 100%{transform:translateX(-50%) scale(1) rotate(-12deg);opacity:1} }
  @keyframes fadeOut { to{opacity:0} }
  .barge { position:absolute; display:flex; align-items:center; gap:14px; max-width:min(92vw,560px); }
  .barge .bubble { background:#17151f; border:3px solid var(--coach); color:#fff; border-radius:26px; padding:14px 20px; font-size:clamp(18px,2.4vw,28px); font-weight:800; line-height:1.3; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .barge.zoom { left:50%; top:50%; transform:translate(-50%,-50%); flex-direction:column; animation:bargeZoom .5s ease-out both; }
  .barge.up { left:50%; bottom:8vh; transform:translateX(-50%); flex-direction:column-reverse; animation:bargeUp .55s cubic-bezier(.2,.9,.3,1.2) both; }
  .barge.right { right:2vw; top:34%; flex-direction:row-reverse; animation:bargeRight .5s cubic-bezier(.2,.9,.3,1.2) both; }
  .barge.drop { left:50%; top:16%; transform:translateX(-50%); flex-direction:column; animation:bargeDrop .9s cubic-bezier(.3,0,.7,1) both; }
  .barge.out { animation:bargeOut .35s ease-in both; }
  @keyframes bargeZoom { 0%{transform:translate(-50%,-50%) scale(.05) rotate(-30deg);opacity:0} 55%{transform:translate(-50%,-50%) scale(1.3) rotate(6deg);opacity:1} 75%{transform:translate(-50%,-50%) scale(.92)} 100%{transform:translate(-50%,-50%) scale(1)} }
  @keyframes bargeUp { 0%{transform:translate(-50%,130%)} 60%{transform:translate(-50%,-6%)} 100%{transform:translate(-50%,0)} }
  @keyframes bargeRight { 0%{transform:translateX(130%) rotate(20deg)} 60%{transform:translateX(-6%) rotate(-4deg)} 100%{transform:none} }
  @keyframes bargeDrop { 0%{transform:translate(-50%,-140vh)} 55%{transform:translate(-50%,0)} 70%{transform:translate(-50%,-14%)} 85%{transform:translate(-50%,0)} 93%{transform:translate(-50%,-5%)} 100%{transform:translate(-50%,0)} }
  @keyframes bargeOut { to{opacity:0; transform:scale(.85) translateY(20px)} }
  @keyframes shakeHard { 0%,100%{transform:translate(0,0)} 10%{transform:translate(-14px,5px) rotate(-1deg)} 20%{transform:translate(12px,-7px) rotate(1deg)} 30%{transform:translate(-9px,7px)} 40%{transform:translate(9px,-5px)} 50%{transform:translate(-7px,3px)} 60%{transform:translate(7px,-3px)} 70%{transform:translate(-4px,2px)} 80%{transform:translate(4px,0)} }
  .shake { animation:shakeHard .6s ease-out; }
  .confetti { position:absolute; top:-20px; width:10px; height:14px; border-radius:2px; animation:confetti linear forwards; }
  @keyframes confetti { 0%{transform:translateY(-10vh) rotate(0);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:.8} }
  .float { position:absolute; right:6vw; top:14vh; font-size:40px; font-weight:900; color:var(--ok); text-shadow:0 2px 0 #fff; animation:floatUp 1.3s ease-out forwards; }
  @keyframes floatUp { 0%{transform:translateY(0) scale(.8);opacity:0} 15%{transform:translateY(-6px) scale(1.2);opacity:1} 100%{transform:translateY(-80px);opacity:0} }

  /* 슬라이드별 */
  .coach-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .coach-btn { background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:12px 8px; color:#fff; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:800; font-size:clamp(13px,1.4vw,17px); transition:transform .12s, border-color .2s; }
  .coach-btn:hover { transform:translateY(-3px); }
  .coach-btn.on { border-color:var(--coach); box-shadow:0 0 0 3px color-mix(in srgb, var(--coach) 40%, transparent); }
  .big-bubble { background:#fff; color:var(--ink); border-radius:28px 28px 28px 8px; padding:20px 24px; font-size:clamp(18px,2.4vw,28px); font-weight:700; line-height:1.35; min-height:3.6em; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .flow { width:100%; height:auto; }
  .flow .step { cursor:pointer; }
  .flow .step .box { fill:#1c1927; stroke:#2b2838; stroke-width:2; transition:fill .3s, stroke .3s; }
  .flow .step.on .box { fill:var(--coach); stroke:#fff; }
  .flow .step text { fill:#fff; font-weight:800; font-family:inherit; }
  .flow .wire { stroke:#3a3650; stroke-width:4; fill:none; stroke-dasharray:900; stroke-dashoffset:900; transition:stroke-dashoffset 1.6s ease; }
  .flow.play .wire { stroke-dashoffset:0; }
  .ring { width:min(46vh,320px); height:min(46vh,320px); position:relative; }
  .ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring .t { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; font-size:clamp(44px,8vh,72px); line-height:1; }
  .ring .t small { font-size:14px; font-weight:600; color:#cfcbe0; margin-top:6px; }
  input[type=range] { width:100%; accent-color:var(--coach); }
  .spice { display:flex; justify-content:space-between; font-weight:800; font-size:clamp(14px,1.6vw,20px); }
  .orbit { width:100%; max-width:720px; height:auto; }
  .orbit text { fill:#fff; font-family:inherit; font-weight:800; }
  .orbit .api { animation:orbitPulse 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes orbitPulse { 0%,100%{opacity:.85} 50%{opacity:1} }
  .qr-wrap { background:#fff; border-radius:28px; padding:18px; display:inline-block; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .qr-wrap svg { display:block; width:min(42vh,320px); height:min(42vh,320px); }
  .url { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:clamp(14px,1.8vw,22px); color:#cfcbe0; word-break:break-all; }
  .k { display:inline-block; background:rgba(255,255,255,.12); border-radius:8px; padding:2px 8px; font-weight:800; font-size:13px; }
  .big { font-size:clamp(60px,12vw,160px); font-weight:900; line-height:1; }
  @media (max-width:760px){ .slide{padding:4vh 16px calc(4vh + 64px)} .card{padding:18px}  .coach-grid{grid-template-columns:repeat(2,1fr)} .row{flex-direction:column}}
</style>
</head>
<body>
<div id="deck"></div>
<div id="stage"></div>
<div id="progress"></div>
<div id="hud"><span id="count"></span><button id="snd" title="소리">🔊 소리 켜짐</button><button id="fs" title="전체화면 (F)">⛶</button></div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;

// ===================== 소리 (Web Audio 합성) =====================
let actx=null, soundOn=true;
const ac=()=>{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); return actx; };
const midi=n=>440*Math.pow(2,(n-69)/12);
function tone({freq,type='sine',start,dur,gain=.4,slideTo,vib}){ if(!soundOn) return; const c=ac(); const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(freq,start); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,start+dur); g.gain.setValueAtTime(.0001,start); g.gain.exponentialRampToValueAtTime(gain,start+.01); g.gain.setValueAtTime(gain,Math.max(start+.01,start+dur-.05)); g.gain.exponentialRampToValueAtTime(.0001,start+dur); if(vib){const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=6; lg.gain.value=vib; l.connect(lg).connect(o.frequency); l.start(start); l.stop(start+dur);} o.connect(g).connect(c.destination); o.start(start); o.stop(start+dur+.02); }
let nb=null; function noise({start,dur,gain=.25,filter=1500}){ if(!soundOn) return; const c=ac(); if(!nb){nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;} const s=c.createBufferSource(); s.buffer=nb; s.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filter; f.Q.value=1.2; const g=c.createGain(); g.gain.setValueAtTime(gain,start); g.gain.exponentialRampToValueAtTime(.0001,start+dur); s.connect(f).connect(g).connect(c.destination); s.start(start); s.stop(start+dur+.02); }
const SFX = {
  blip(){ const t=ac().currentTime; tone({freq:900,type:'square',start:t,dur:.05,gain:.12}); },
  boing(){ const t=ac().currentTime; tone({freq:420,slideTo:140,start:t,dur:.35,gain:.35,vib:30}); tone({freq:300,slideTo:120,start:t+.3,dur:.25,gain:.2}); },
  airhorn(){ const t=ac().currentTime; for(const d of [-6,0,7]) tone({freq:midi(57)*Math.pow(2,d/1200),slideTo:midi(55),type:'sawtooth',start:t,dur:.9,gain:.2}); },
  boo(){ const t=ac().currentTime; tone({freq:midi(50),slideTo:midi(38),type:'sawtooth',start:t,dur:1,gain:.22}); },
  fanfare(){ const t=ac().currentTime; [[72,0,.15],[72,.15,.15],[72,.3,.15],[72,.45,.3],[68,.75,.3],[70,1.05,.3],[72,1.35,.2],[70,1.55,.15],[72,1.7,.7]].forEach(([n,s,d])=>{tone({freq:midi(n),type:'square',start:t+s,dur:d,gain:.16}); tone({freq:midi(n-12),type:'triangle',start:t+s,dur:d,gain:.14});}); for(let i=0;i<30;i++) noise({start:t+1.7+Math.random()*.9,dur:.07,gain:.18,filter:2500+Math.random()*2000}); },
  applause(){ const t=ac().currentTime; for(let i=0;i<40;i++) noise({start:t+Math.random()*1.6,dur:.08,gain:.22,filter:1500+Math.random()*2500}); },
  ding(){ const t=ac().currentTime; tone({freq:1318,start:t,dur:.8,gain:.3}); tone({freq:2637,start:t,dur:.5,gain:.08}); },
  siren(){ const t=ac().currentTime; for(let i=0;i<3;i++){ tone({freq:700,slideTo:1100,type:'square',start:t+i*.5,dur:.25,gain:.2}); tone({freq:1100,slideTo:700,type:'square',start:t+i*.5+.25,dur:.25,gain:.2}); } },
  sting(){ const t=ac().currentTime; [60,60,67,67,72].forEach((n,i)=>tone({freq:midi(n),type:'square',start:t+i*.11,dur:i===4?.45:.1,gain:.14})); },
};

let voices=[]; const loadV=()=>{ voices=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith('ko')); };
if('speechSynthesis' in window){ loadV(); speechSynthesis.onvoiceschanged=loadV; }
let speakingEl=null;
let clipAudio=null;
function speak(text, coach, el, key){
  if(!soundOn) return;
  const clip = key && clipOf(coach.id, key);
  if(clip){
    if('speechSynthesis' in window) speechSynthesis.cancel();
    try{ clipAudio&&clipAudio.pause(); }catch{}
    const a=new Audio(clip.src); clipAudio=a;
    if(el){ el.classList.add('talking'); }
    const end=()=>{ el&&el.classList.remove('talking'); };
    a.onended=end; a.onerror=end; a.play().catch(end);
    return;
  }
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}]/gu,''));
  const v=coach.hint.map(h=>voices.find(x=>x.name.includes(h))).find(Boolean)||voices[0];
  if(v) u.voice=v; u.lang='ko-KR'; u.pitch=coach.pitch; u.rate=coach.rate;
  if(el){ el.classList.add('talking'); if(speakingEl&&speakingEl!==el) speakingEl.classList.remove('talking'); speakingEl=el; }
  u.onend=u.onerror=()=>{ el&&el.classList.remove('talking'); };
  speechSynthesis.speak(u);
}

const stage=document.getElementById('stage');

function stamp(text,color){ const s=el(`<div class="stamp" style="--c:${color}">${text}</div>`); stage.appendChild(s); setTimeout(()=>s.remove(),2000); }
function shake(){ const d=document.getElementById('deck'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
function flash(color){ const f=el(`<div class="fx-flash" style="background:${color}"></div>`); stage.appendChild(f); setTimeout(()=>f.remove(),700); }
function confetti(colors){ for(let i=0;i<70;i++){ const p=el(`<span class="confetti" style="left:${Math.random()*100}%;background:${colors[i%colors.length]};animation-delay:${Math.random()*.8}s;animation-duration:${1.8+Math.random()*1.4}s;transform:rotate(${Math.random()*360}deg)"></span>`); stage.appendChild(p); setTimeout(()=>p.remove(),3600);} }
function floatPts(txt){ const f=el(`<div class="float">${txt}</div>`); stage.appendChild(f); setTimeout(()=>f.remove(),1400); }
let bargeEl=null;
function barge({coach, expr, text, entrance='up', big=false, hold=3000, speakIt=true, key=null}){
  const clip = key && clipOf(coach.id, key); if(clip) text = clip.text;
  if(bargeEl) bargeEl.remove();
  const b=el(`<div class="barge ${entrance}" style="--coach:${coach.color}"><div class="faceWrap" style="border-radius:50%;background:${coach.soft};box-shadow:0 0 0 5px ${coach.color}55;padding:6px">${face(coach.id,expr,big?220:120,{talking:speakIt})}</div><div class="bubble">${text}</div></div>`);
  stage.appendChild(b); bargeEl=b;
  if(speakIt) speak(text, coach, b.querySelector('.face'), key);
  setTimeout(()=>{ b.classList.add('out'); setTimeout(()=>{ b.remove(); if(bargeEl===b) bargeEl=null; },380); }, hold);
}
function jumpScare(coach, text, key='leave'){
  const black=el('<div class="fx-black"></div>'); stage.appendChild(black);
  SFX.airhorn();
  setTimeout(()=>{ black.remove(); const tint=el('<div class="fx-tint"></div>'); stage.appendChild(tint); setTimeout(()=>tint.remove(),3200);
    barge({coach, expr:'shout', text, entrance:'zoom', big:true, hold:3200, key}); shake(); flash('#e34948'); setTimeout(()=>stamp('탈주 감지!!','#e34948'),350); },260);
}

  <div class="row">
    <div style="flex:1;min-width:280px">
      <h2>잡도리 강도</h2>

  </div>

<div class="slide-inner">
  <div class="kicker">FOR YOU</div>
  <h2>이런 분께 <em>딱</em>입니다.</h2>
  <div class="row" style="align-items:stretch;margin-top:1vh">
    ${[['📚','작심삼일 수험생','"저녁 8시 토익 30분" 한 줄. 8시에 군대 조교가 "기상!!" 하고 깨우고, 30분 링이 다 찰 때까지 잔소리.'],['🏃','퇴근하고 운동 결심한 직장인','퇴근 후 7시, 엄마가 "일어나랑께!!" 하고 소리치면 신발은 신게 된다.'],['🏠','혼자 공부하는 사람','아무도 안 보는 방에서 탈주하면 혼나고, 끝내면 팡파레. 옆에 누가 있는 느낌.']].map(([e,t,d])=>`<div class="card frag" style="flex:1;min-width:220px"><div style="font-size:40px">${e}</div><div style="font-size:clamp(18px,2.2vw,26px);font-weight:900;margin:8px 0 6px">${t}</div><div style="color:#cfcbe0;font-size:clamp(14px,1.5vw,17px);line-height:1.5">${d}</div></div>`).join('')}
  </div>
  <div class="frag" style="margin-top:3vh;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    ${['🆓 전부 무료','🔓 아이디만으로 가입','🚫 광고 없음','📲 홈 화면에 설치'].map(t=>`<span class="chip" style="font-size:clamp(15px,1.8vw,20px);padding:12px 20px;background:var(--coach);color:#fff">${t}</span>`).join('')}
  </div>
</div>`);

  <div class="kicker">AND MORE</div>
  <h2>그리고 <em>이런 것도</em> 됩니다.</h2>
  <div class="row" style="align-items:stretch;margin-top:1vh">
    ${[['🎤','내 목소리 녹음','"일어나!", "잘했어!" 같은 6마디만 녹음하면 엄마·친구·애인 목소리로 잡도리. 기기에만 저장.'],['🏆','칭호 레벨업','잡도리 신입 → 작심삼일 탈출 → 미루기 금지 → 집중 머신 → 잡도리 마스터. 올라갈 때마다 팡파레.'],['📸','자랑 카드','끝내면 코치 얼굴과 "30분 완료 · 연속 5일" 카드를 한 장으로. 바로 공유.'],['🔒','다음: 진짜 폰 잠금','지금은 웹이라 탈주 감지까지. 앱 버전에서는 화면을 진짜로 잠그고 꺼져 있어도 깨웁니다.']].map(([e,t,d])=>`<div class="card frag" style="flex:1;min-width:220px"><div style="font-size:36px">${e}</div><div style="font-size:clamp(18px,2.2vw,26px);font-weight:900;margin:8px 0 6px">${t}</div><div style="color:#cfcbe0;font-size:clamp(14px,1.5vw,17px);line-height:1.5">${d}</div></div>`).join('')}

// 10 QR
S.push(`
<div class="slide-inner" style="text-align:center">
  <div class="kicker">TRY IT NOW</div>
  <h2>지금 바로 <em>잡도리</em> 당해보세요.</h2>
  <div class="row" style="justify-content:center;margin-top:1vh">

    <div style="text-align:left;max-width:420px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div id="qr-face">${face('bro','smug',96,{cls:'live'})}</div><div class="big-bubble" style="font-size:clamp(16px,2vw,22px);padding:14px 18px;min-height:0">뭘 봐. 찍어.</div></div>
      <p class="lead" style="font-size:clamp(15px,1.8vw,20px)">카메라로 찍으면 바로 열려요.<br>iPhone은 공유 → <b style="color:#fff">홈 화면에 추가</b>, Android는 <b style="color:#fff">앱 설치</b>.</p>
      <p class="url" id="url-text" style="margin-top:12px"></p>
      <p id="credit" style="margin-top:14px;color:#9a97ad;font-size:12px;line-height:1.5"></p>
    </div>
  </div>
</div>`);

// ===================== 렌더 & 내비게이션 =====================
const deck=document.getElementById('deck');
S.forEach((html,i)=>{ const s=document.createElement('section'); s.className='slide'; s.innerHTML=html; s.dataset.i=i; deck.appendChild(s); });
const slides=[...deck.children];
let cur=0;
function show(i, dir=1){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>{ s.classList.toggle('active',j===cur); s.classList.toggle('past',j<cur); });
  slides[cur].scrollTop = 0;
  document.getElementById('progress').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('count').textContent=`${cur+1} / ${slides.length}`;

  if(dir>0) SFX.blip();
  stage.innerHTML=''; bargeEl=null; if('speechSynthesis' in window) speechSynthesis.cancel(); try{ clipAudio&&clipAudio.pause(); }catch{}
  onEnter(cur);
}
function next(){ const s=slides[cur]; const f=s.querySelector('.frag:not(.on)'); if(f){ f.classList.add('on'); SFX.blip(); return; } if(cur<slides.length-1) show(cur+1,1); }
function prev(){ if(cur>0) show(cur-1,-1); }
// 빈 곳을 클릭하면 좌 15% = 이전, 나머지 = 다음 (버튼·슬라이더·얼굴 등은 제외)
// 얼굴처럼 누르면 다시 그려지는 요소는 e.target 이 문서에서 빠져서 closest 로 못 찾는다 → 눌렀을 때의 경로(composedPath)로 확인
const NO_FLIP='button,input,select,a,.coach-btn,.step,#hero-face,.big-bubble,.card';
deck.addEventListener('click',e=>{ if(!e.target.isConnected || e.composedPath().some(el=>el.matches?.(NO_FLIP))) return; (e.clientX < innerWidth*.15 ? prev : next)(); });
addEventListener('hashchange',()=>{ const h=Number((location.hash.match(/s(\d+)/)||[])[1]); if(h&&h-1!==cur) show(h-1,0); });
addEventListener('keydown',e=>{ if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next();} else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();} else if(e.key==='f'||e.key==='F'){ toggleFS(); } });
// 옆으로 확실히 민 경우만 장 넘김 (세로 스크롤과 구분)
let tx=null, ty=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX; ty=e.touches[0].clientY;},{passive:true}); addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) (dx<0?next():prev()); tx=ty=null; });
function toggleFS(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
document.getElementById('fs').onclick=toggleFS;
document.getElementById('snd').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐'; if(!soundOn) speechSynthesis?.cancel(); };
addEventListener('pointerdown',()=>{ try{ac();}catch{} },{once:true});

// ===================== 슬라이드별 인터랙션 =====================
const EXPRS=['angry','shout','smug','happy','love','worried','sad','sleepy','surprised'];
let heroI=0;
document.getElementById('hero-face').onclick=function(){ heroI=(heroI+1)%EXPRS.length; const ex=EXPRS[heroI]; this.innerHTML=face('bro',ex,Math.min(260,innerHeight*.32),{cls:'live'}); SFX.boing(); const lines={angry:'뭘 봐.',shout:'야!! 일어나!!',smug:'오늘부터 네 인생 내가 잡도리한다.',happy:'봐, 할 수 있잖아!',love:'…솔직히 좀 멋있었다.',worried:'어디 가? 돌아와.',sad:'포기? 내일 다시 해.',sleepy:'수고했다. 자.',surprised:'어?! 벌써 끝났어?'}; const keys={angry:'hello',shout:'alarm',smug:'hello',happy:'done',love:'done',worried:'leave',sad:'quit',sleepy:'night',surprised:'target'}; const clip=clipOf('bro',keys[ex]); speak(clip?clip.text:lines[ex], C.bro, this.querySelector('.face'), keys[ex]); };

let pc=0; const PLINES=['그래, 내일. 내일의 너는 다른 사람이냐?','두 번째다. 내일은 영원히 안 온다.','세 번째… 작심삼일 완성. 축하한다.','이제 그만 눌러. 하라고.'];
document.getElementById('procrast').onclick=()=>{ pc++; document.getElementById('procrast-n').textContent=`미룬 횟수: ${pc}`; const ex=pc<2?'angry':'shout'; const ent=pc===1?'up':pc===2?'right':'drop'; if(pc===3){ jumpScare(C.bro, PLINES[2], 'leave'); setTimeout(()=>stamp('작심삼일','#ffb020'),2300); } else { barge({coach:C.bro, expr:ex, text:PLINES[Math.min(pc-1,3)], entrance:ent, hold:2800, key: pc===1?'skip':pc===2?'idle':'nudge'}); shake(); if(pc>3) SFX.boo(); } };

let curCoach='bro';
function setCoach(id, lineIdx){ curCoach=id; const c=C[id]; document.documentElement.style.setProperty('--coach',c.color); document.querySelectorAll('.coach-btn').forEach(b=>b.classList.toggle('on',b.dataset.coach===id)); const big=document.getElementById('coach-big'); big.style.background=c.soft; big.style.boxShadow=`0 0 0 6px ${c.color}55`; const ex=['shout','worried','love'][lineIdx]; big.innerHTML=face(id,ex,Math.min(220,innerHeight*.28),{cls:'live'}); const key=['alarm','nudge','done'][lineIdx]; const clip=clipOf(id,key); const text=clip?clip.text:c.lines[lineIdx]; document.getElementById('coach-bubble').innerHTML=text+(VOICE[id]?`<br><span style="color:#9a97ad;font-size:14px">🎙 ${VOICE[id].name}</span>`:''); speak(text,c,big.querySelector('.face'),key); const ctl=document.getElementById('coach-ctl'); ctl.innerHTML=['🚨 알람','😤 잔소리','🎉 칭찬'].map((l,i)=>`<button class="chip" data-l="${i}" style="${i===lineIdx?`background:${c.color}`:''}">${l}</button>`).join(''); ctl.querySelectorAll('button').forEach(b=>b.onclick=()=>setCoach(id,Number(b.dataset.l))); }
document.querySelectorAll('.coach-btn').forEach(b=>b.onclick=()=>{ SFX.sting(); setCoach(b.dataset.coach,0); });

const flow=document.getElementById('flow'); const steps=[...flow.querySelectorAll('.step')]; let flowTimer=null;
function flowGo(i){ steps.forEach((s,j)=>s.classList.toggle('on',j<=i)); }
steps.forEach(s=>s.onclick=()=>{ clearInterval(flowTimer); flowGo(Number(s.dataset.i)); SFX.blip(); });

let demo={t:null,sec:0,hit:false};
const RING=741.4;
function demoReset(){ clearInterval(demo.t); demo={t:null,sec:0,hit:false}; document.getElementById('ring-bar').setAttribute('stroke-dashoffset',RING); document.getElementById('ring-bar').setAttribute('stroke','#fff'); document.getElementById('ring-time').textContent='00:00'; document.getElementById('ring-sub').textContent='목표 10초 · 0%'; }
document.getElementById('demo-start').onclick=()=>{ demoReset(); barge({coach:C[curCoach],expr:'smug',text:'시작! 핸드폰 엎어! 끝날 때까지 말 걸지 마!',entrance:'up',hold:2600,key:'start'}); setTimeout(()=>stamp('GO!',C[curCoach].color),350); demo.t=setInterval(()=>{ demo.sec+=.1; const p=Math.min(1,demo.sec/10); document.getElementById('ring-bar').setAttribute('stroke-dashoffset',RING*(1-p)); document.getElementById('ring-time').textContent='00:'+String(Math.floor(demo.sec)).padStart(2,'0'); document.getElementById('ring-sub').textContent=demo.hit?'🎯 목표 달성! 더 가도 돼':`목표 10초 · ${Math.round(p*100)}%`; if(p>=1&&!demo.hit){ demo.hit=true; document.getElementById('ring-bar').setAttribute('stroke','#1baf7a'); SFX.fanfare(); confetti([C[curCoach].color,'#ffd166','#fff','#ff6fb5','#12b5c9']); stamp('🎯 달성!','#1baf7a'); floatPts('+5P'); barge({coach:C[curCoach],expr:'love',text:'목표 시간 달성! 오늘 네가 네 한계 깼다!',entrance:'up',hold:3000,key:'target'}); } },100); };
document.getElementById('demo-leave').onclick=()=>{ jumpScare(C[curCoach], '1번째 탈주… 한 번만 더 나가면 내가 네 핸드폰 뺏는다.', 'leave'); };
document.getElementById('demo-done').onclick=()=>{ clearInterval(demo.t); SFX.fanfare(); setTimeout(()=>SFX.applause(),600); confetti([C[curCoach].color,'#ffd166','#fff','#ff6fb5','#12b5c9']); stamp('완료!','#1baf7a'); floatPts('+12P'); setTimeout(()=>barge({coach:C[curCoach],expr:'love',text:'끝!! 봐, 할 수 있잖아! 오늘 네가 이겼다!',entrance:'up',big:true,hold:3200,key:'done'}),500); };

const SP=[{n:'🍼 순한맛',nudge:15,idle:90,soon:'없음',snooze:3,ex:'smile',d:'부담 없이. 그래도 안 하면 혼남.'},{n:'🌶️ 보통',nudge:10,idle:60,soon:'10분 전',snooze:2,ex:'angry',d:'기본. 알람 전에 미리 예고.'},{n:'🔥 매운맛',nudge:5,idle:30,soon:'10분 전',snooze:1,ex:'shout',d:'5분 미루기 딱 한 번. 쉬면 30분 만에 재촉.'}];
function spice(v){ const s=SP[v]; document.getElementById('spice-card').innerHTML=`<div style="font-size:clamp(22px,2.8vw,32px);font-weight:900">${s.n}</div><div style="color:#cfcbe0;margin:6px 0 14px">${s.d}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:clamp(14px,1.6vw,18px)"><div class="chip">잔소리 <b>&nbsp;${s.nudge}분마다</b></div><div class="chip">쉬면 재촉 <b>&nbsp;${s.idle}분</b></div><div class="chip">알람 예고 <b>&nbsp;${s.soon}</b></div><div class="chip">5분 미루기 <b>&nbsp;${s.snooze}번</b></div></div>`; document.getElementById('spice-face').innerHTML=face(curCoach,s.ex,Math.min(260,innerHeight*.3),{cls:'live'}); }
document.getElementById('spice').oninput=e=>{ spice(Number(e.target.value)); SFX.blip(); if(e.target.value==='2'){ shake(); flash('#e34948'); } };
spice(1);

// QR
(function(){ try{ const q=qrcode(0,'M'); q.addData(APP_URL); q.make(); document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true}); }catch(e){ document.getElementById('qr').innerHTML='<div style="color:#17151f;padding:20px">QR 생성 실패</div>'; } document.getElementById('url-text').textContent=APP_URL;
  const names=Object.values(VOICE).map(v=>v.name); if(names.length) document.getElementById('credit').textContent=`코치 음성: AI 가상 성우 서비스 타입캐스트(https://typecast.ai) · 캐스팅 ${names.join(', ')}`; })();

function onEnter(i){
  if(i===4){ flow.classList.remove('play'); void flow.offsetWidth; flow.classList.add('play'); flowGo(-1); let k=-1; clearInterval(flowTimer); flowTimer=setInterval(()=>{ k++; flowGo(k); SFX.blip(); if(k>=steps.length-1) clearInterval(flowTimer); },700); }
  if(i===5) demoReset();
  if(i===9){ setTimeout(()=>speak('뭘 봐. 찍어.', C[curCoach], document.querySelector('#qr-face .face')),400); }
}
const h=Number((location.hash.match(/s(\d+)/)||[])[1]); show(h?h-1:0,0);
</script>
